name: Demo site

# Publishes the interactive demo to GitHub Pages.
#
# GitHub Pages is static hosting, so the demo runs the real UI against an
# in-browser accounting engine: nothing is saved and no server is involved.
# See demo/ and scripts/build-demo.mjs.
#
# The site is published from the `gh-pages` branch, which keeps Pages on the
# standard "deploy from a branch" setting and needs no repository-admin token.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the demo site
        run: node scripts/build-demo.mjs

      - name: Publish docs/ to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Demo site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
